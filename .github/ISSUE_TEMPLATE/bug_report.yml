name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: input
    id: hyperchromia-version
    attributes:
      label: HyperChromia version
      description: Output of `hy status` or `/etc/os-release` VERSION_ID
      placeholder: v1.0.0
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: Real hardware model, or VM (e.g. Proxmox, VirtualBox)
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output of `journalctl -u <service>` or `hy status`, if applicable
      render: shell
    validations:
      required: false
