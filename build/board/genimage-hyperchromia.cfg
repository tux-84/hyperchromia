image efi-part.vfat {
	vfat {
		file EFI {
			image = "efi-part/EFI"
		}

		file bzImage-a {
			image = "bzImage"
		}

		file bzImage-b {
			image = "bzImage"
		}

		file initrd-a {
			image = "initramfs.cpio.gz"
		}

		file initrd-b {
			image = "initramfs.cpio.gz"
		}
	}

	size = 98304K
}

image data.ext4 {
	ext4 {
		label = "data"
	}
	size = 512M
	empty = true
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition liveboot {
		image = "efi-part.vfat"
		partition-type-uuid = U
		partition-uuid = bed695b5-d1be-40b5-ade2-9d13b529df50
		offset = 32K
		bootable = true
	}

	partition liveA {
		partition-type-uuid = 44479540-f297-41b2-9af7-d131d5f0458a
		partition-uuid = f54800ba-2b75-4380-881f-bd2e13631258
		image = "rootfs.squashfs"
		size = 1G
	}

	partition liveB {
		partition-type-uuid = 44479540-f297-41b2-9af7-d131d5f0458a
		partition-uuid = 8c349d5c-a6ea-4466-a600-b646ee3ddee3
		image = "rootfs.squashfs"
		size = 1G
	}

	partition livedata {
		partition-type-uuid = 0fc63daf-8483-4772-8e79-3d69d8477de4
		partition-uuid = 87c7caf5-05fb-4bec-b063-f0b811fa80bd
		image = "data.ext4"
	}
}
