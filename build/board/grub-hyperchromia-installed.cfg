set default="0"
set timeout="4"
set timeout_style="menu"

load_env

if [ -z "$hyperchromia_active_slot" ]; then
  set hyperchromia_active_slot=a
fi

if [ "$hyperchromia_pending" = "1" ]; then
  if [ "$hyperchromia_active_slot" = "a" ]; then
    set hyperchromia_active_slot=b
  else
    set hyperchromia_active_slot=a
  fi
  set hyperchromia_pending=
else
  set hyperchromia_pending=1
fi
save_env hyperchromia_active_slot hyperchromia_pending

if [ "$hyperchromia_active_slot" = "a" ]; then
  set hyperchromia_root_label=rootA
  set hyperchromia_kernel=/bzImage-a
  set hyperchromia_initrd=/initrd-a
else
  set hyperchromia_root_label=rootB
  set hyperchromia_kernel=/bzImage-b
  set hyperchromia_initrd=/initrd-b
fi

menuentry "HyperChromia" {
 linux $hyperchromia_kernel root=PARTLABEL=$hyperchromia_root_label ro rootwait console=tty1 nomodeset systemd.show_status=true init=/sbin/hyperchromia-init-overlay
 initrd $hyperchromia_initrd
}
